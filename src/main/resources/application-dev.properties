logging.level.root=INFO
logging.level.org.springframework.web.client=INFO
level.org.springframework.web.client.RestTemplate=INFO
server.port=8282
spring.main.allow-bean-definition-overriding=true

#Metrics related configurations
management.endpoint.metrics.enabled=true
management.endpoints.web.exposure.include=*
management.endpoint.prometheus.enabled=true
#management.metrics.export.prometheus.enabled=true

spring.config.import=optional:file:./storagefile.properties

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=StorageFilePool

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true


#logging.level.org.springframework.boot.autoconfigure=DEBUG