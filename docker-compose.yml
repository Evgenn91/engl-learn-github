services:
  postgres:
    image: postgres:15
    container_name: englishlearning-postgres
    environment:
      POSTGRES_DB: englishlearning
      POSTGRES_USER: englishlearning
      POSTGRES_PASSWORD: englishlearning
    ports:
      - "5433:5432"
    volumes:
      - englishlearning-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  englishlearning-data: